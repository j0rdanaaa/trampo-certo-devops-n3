name: CD - Deploy Trampo Certo AWS

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  deploy:
    name: Testar e publicar na AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do GitHub
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar codigo com ESLint
        run: npm run lint

      - name: Executar testes Jest
        run: npm run test:coverage

      - name: Configurar conexao SSH com AWS
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "$EC2_HOST" > ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts | grep -F "SHA256:r+AMCCFDCoOXYwMkPD0zfYEhPhbSEqvFgEhvZwvttPE"

      - name: Atualizar Trampo Certo na EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ed25519 "$EC2_USER@$EC2_HOST" << 'EOF'
            set -e

            cd /opt/trampo-certo-devops-n3

            git fetch origin develop
            git checkout develop
            git pull --ff-only origin develop

            npm ci

            PORT=3003 DEMO_MODE=true pm2 restart trampo-certo-n3 --update-env

            curl --fail --silent --show-error \
              --retry 5 --retry-delay 2 \
              http://127.0.0.1:3003/interface/ > /dev/null

            echo "Deploy do Trampo Certo concluido!"
          EOF
